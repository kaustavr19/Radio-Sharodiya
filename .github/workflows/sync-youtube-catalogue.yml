name: Sync YouTube catalogue

on:
  schedule:
    - cron: '17 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-catalogue-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh validated catalogue
        run: npm run sync:youtube
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Verify station
        run: npm run verify
      - name: Commit a valid catalogue change
        run: |
          if git diff --quiet -- public/data/pujo/catalogue.v1.json; then
            echo "Catalogue is already current."
            exit 0
          fi
          git config user.name "kaustavr19"
          git config user.email "54073521+kaustavr19@users.noreply.github.com"
          git add public/data/pujo/catalogue.v1.json
          git commit -m "chore: refresh YouTube catalogue"
          git push
